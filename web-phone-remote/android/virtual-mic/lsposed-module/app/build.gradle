plugins {
    id "com.android.application"
}

android {
    namespace "com.wsphone.virtualmic"
    compileSdk 34

    defaultConfig {
        applicationId "com.wsphone.virtualmic"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
