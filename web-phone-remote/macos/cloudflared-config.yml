# Local deployment template. Replace placeholders before using.
# Never commit tunnel credentials or production tunnel identifiers.
tunnel: YOUR_TUNNEL_UUID
credentials-file: /Users/YOUR_USER/Library/Application Support/PhoneCloudManager/tunnel/credentials.json
ingress:
  - hostname: phone.example.com
    service: http://127.0.0.1:8002
  # Uncomment only after implementing SSH authentication / access controls:
  # - hostname: ssh.example.com
  #   service: ssh://127.0.0.1:22
  - service: http_status:404
