<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ws-scrcpy-web stream</title>
    <link rel="stylesheet" href="ws-scrcpy.css?v=20261106c">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            /* Must match the parent page's dark color-scheme, otherwise the
               browser paints an opaque white canvas behind the iframe and the
               letterbox beside the phone image turns white. */
            color-scheme: dark;
            background: #000;
            overflow: hidden;
        }
        /* Body is the flex parent for .device-view so the stream fills the viewport. */
        body { display: flex; }
        #status {
            position: fixed; top: 8px; left: 8px;
            font: 11px/1.4 "JetBrains Mono", ui-monospace, Consolas, monospace;
            letter-spacing: .02em;
            color: #c8ccd2;
            background: rgba(15, 16, 17, .82);
            border: 1px solid rgba(255, 255, 255, .15);
            padding: 4px 8px;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 1000;
        }
        #status.hidden { display: none; }
    </style>
</head>
<body data-embed-entry>
    <div id="status">connecting...</div>
    <script src="ws-scrcpy.umd.js?v=20261113s"></script>
    <script src="embed.js?v=20261113s"></script>
</body>
</html>
