<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>云手机后台总控</title>
    <style>
        :root{color-scheme:dark;--bg:#07111f;--panel:#0d1a2c;--line:#233751;--muted:#89a0ba;--text:#eaf3ff;--blue:#3892ff;--green:#2dcf7c;--red:#ff6f7d}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
        .shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.side{padding:22px 16px;border-right:1px solid var(--line);background:#091525}.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--blue);font-size:21px;font-weight:800}.brand strong{display:block;font-size:18px}.brand small{color:var(--muted)}
        .nav{display:grid;gap:7px}.nav button,.nav a{display:flex;align-items:center;width:100%;height:42px;padding:0 13px;border:0;border-radius:9px;color:#afc0d5;background:transparent;text-decoration:none;text-align:left}.nav button:hover,.nav a:hover,.nav .active{color:white;background:#142943}.nav .bottom{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
        main{min-width:0;padding:24px 28px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.top h1{font-size:24px;margin:0}.top p{color:var(--muted);margin:4px 0 0}.top .refresh{margin-left:auto;color:var(--muted)}
        .stats{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat,.card{border:1px solid var(--line);background:var(--panel);border-radius:14px}.stat{padding:15px 17px}.stat small{display:block;color:var(--muted);margin-bottom:7px}.stat strong{font-size:25px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
        .content{display:grid;grid-template-columns:minmax(340px,.78fr) minmax(520px,1.45fr);gap:14px}.card{padding:18px}.card h2{font-size:17px;margin:0 0 15px}.field{margin-bottom:13px}.field label{display:block;color:#b9c9dc;font-weight:650;margin-bottom:7px}.field input,.field select{width:100%;height:42px;padding:0 12px;border:1px solid #304863;border-radius:9px;background:#081525;color:white;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3892ff25}.code-row{display:grid;grid-template-columns:1fr auto;gap:7px}.secondary,.primary,.danger{height:38px;padding:0 13px;border-radius:8px;font-weight:700}.secondary{border:1px solid #38506c;background:#12243a;color:#d9e8fa}.primary{border:0;background:var(--blue);color:#fff}.danger{border:1px solid #63313b;background:#321b25;color:#ff9ca6}.form-actions{display:flex;gap:8px;margin-top:15px}.form-actions .primary{flex:1}
        .device-picks{display:grid;gap:7px;max-height:310px;overflow:auto}.device-pick{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding:10px;border:1px solid #253a53;border-radius:9px;background:#0a1728}.device-pick input{accent-color:var(--blue);width:17px;height:17px}.device-pick small{color:var(--muted)}.online,.offline{width:7px;height:7px;border-radius:50%}.online{background:var(--green)}.offline{background:#65778e}
        .table{border:1px solid var(--line);border-radius:11px;overflow:auto}.row{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(260px,1.45fr) minmax(145px,.7fr) minmax(250px,1.1fr);gap:12px;align-items:center;min-width:870px;padding:12px;border-top:1px solid #1d3048}.row:first-child{border-top:0}.head{color:var(--muted);font-size:12px;background:#101f33}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#a9d0ff}.user-cell{display:grid;gap:4px;min-width:0}.user-cell b,.user-cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-cell small{color:var(--muted);font-size:12px}.device-manager{display:grid;gap:8px;min-width:0}.device-chips{display:flex;flex-wrap:wrap;gap:6px}.device-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:5px 6px 5px 8px;border:1px solid #304863;border-radius:7px;background:#0a1728;color:#c8d8ea}.device-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.device-chip button{display:grid;place-items:center;width:21px;height:21px;padding:0;border:0;border-radius:5px;background:#3a2029;color:#ff9ca6;font-weight:800;line-height:1}.device-empty{color:var(--muted)}.quick-assign{display:flex;gap:6px}.quick-assign select{min-width:0;flex:1;height:32px;padding:0 8px;border:1px solid #304863;border-radius:7px;background:#081525;color:#d9e8fa}.quick-assign button{height:32px;padding:0 10px;white-space:nowrap}.expiry{display:grid;gap:3px;color:#b8c8da}.expiry small{color:var(--green)}.expired .expiry small{color:var(--red)}.disabled,.expired{opacity:.58}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{height:30px;padding:0 9px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;padding:11px 15px;border-radius:9px;background:#183a2d;color:#8ff0b9;box-shadow:0 12px 40px #0008;display:none}.toast.error{background:#47232b;color:#ff9da8}
        dialog{width:min(390px,calc(100vw - 28px));padding:22px;border:1px solid #304863;border-radius:15px;color:var(--text);background:#0d1a2c;box-shadow:0 28px 90px #000b}dialog::backdrop{background:#020812c9;backdrop-filter:blur(4px)}dialog h3{margin:0 0 9px;font-size:19px}dialog p{margin:8px 0;color:var(--muted);line-height:1.55}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.qr-image{display:block;width:260px;height:260px;margin:14px auto;border-radius:10px;background:#fff}.qr-code{text-align:center;font:700 22px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:#a9d0ff}
        #proxy-panel{display:none;padding:0;height:calc(100vh - 48px)}#proxy-frame{width:100%;height:100%;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
        @media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:4;padding:10px 13px;border:0;border-bottom:1px solid var(--line)}.brand{margin:0}.brand small{display:none}.nav{display:flex;margin-top:9px;overflow:auto}.nav button,.nav a{width:auto;white-space:nowrap}.nav .bottom{margin:0;padding:0;border:0}main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr;min-width:0}.head{display:none}.device-manager,.actions{grid-column:1/-1}.shell.proxy main{padding:8px}#proxy-panel{height:calc(100vh - 132px)}}
    </style>
</head>
<body>
<div class="shell">
    <aside class="side">
        <div class="brand"><span class="logo">控</span><div><strong>云手机总控</strong><small>Mac 管理端</small></div></div>
        <nav class="nav">
            <button class="active" data-panel="rentals">设备与租用</button>
            <button data-panel="proxy">SOCKS5 代理</button>
            <a href="/">打开设备墙</a>
            <button class="bottom" id="logout">退出管理端</button>
        </nav>
    </aside>
    <main>
        <section id="rentals-panel">
            <header class="top"><div><h1>后台总控</h1><p>创建识别码并分配可操作的云手机</p></div><span class="refresh">实时更新</span></header>
            <div class="stats">
                <div class="stat"><small>在线手机</small><strong id="online-count">0</strong></div>
                <div class="stat"><small>租用识别码</small><strong id="rental-count">0</strong></div>
                <div class="stat"><small>已分配手机</small><strong id="assigned-count">0</strong></div>
                <div class="stat"><small>外网入口</small><strong style="font-size:16px">phone.anyuekf.cn</strong></div>
            </div>
            <div class="content">
                <form class="card" id="rental-form">
                    <h2 id="form-title">新建租用识别码</h2>
                    <div class="field"><label for="rental-label">客户备注</label><input id="rental-label" maxlength="64" placeholder="例如：客户张三" required></div>
                    <div class="field"><label for="rental-code">唯一识别码（2 个小写字母 + 6 位数字）</label><div class="code-row"><input id="rental-code" minlength="8" maxlength="8" pattern="[a-z]{2}[0-9]{6}" inputmode="text" required><button class="secondary" id="generate" type="button">随机生成</button></div></div>
                    <div class="field"><label for="rental-duration">租用时间</label><select id="rental-duration"><option value="keep" hidden>保持当前到期时间</option><option value="1">1 小时</option><option value="6">6 小时</option><option value="24">1 天</option><option value="72">3 天</option><option value="168" selected>7 天</option><option value="720">30 天</option><option value="0">永久有效</option></select></div>
                    <div class="field"><label>分配云手机</label><div class="device-picks" id="device-picks"><div class="empty">正在读取设备…</div></div></div>
                    <div class="form-actions"><button class="primary" type="submit">保存并生效</button><button class="secondary" id="cancel-edit" type="button" hidden>取消编辑</button></div>
                </form>
                <section class="card"><h2>租用用户列表</h2><div class="table" id="rental-table"><div class="empty">正在读取…</div></div></section>
            </div>
        </section>
        <section id="proxy-panel"><iframe id="proxy-frame" title="SOCKS5 代理管理"></iframe></section>
    </main>
</div>
<dialog id="qr-dialog"><h3>扫码打开云手机登录页</h3><p>二维码不包含识别码，客户扫码后仍需手动输入。</p><img class="qr-image" id="qr-image" alt="云手机登录二维码"><div class="qr-code" id="qr-code"></div><form class="dialog-actions" method="dialog"><button class="primary" value="close">关闭</button></form></dialog>
<dialog id="delete-dialog"><h3>确认删除租用</h3><p id="delete-message"></p><p>删除后识别码立即失效，已登录的客户也会退出。</p><form class="dialog-actions" method="dialog"><button class="secondary" value="cancel">取消</button><button class="danger" value="delete">确认删除</button></form></dialog>
<div class="toast" id="toast"></div>
<script>
(() => {
    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const names = {HD1925:'一加 7T Pro 迈凯伦','Pixel 8':'谷歌 Pixel 8',A101BM:'巴慕达 Phone',CPH2211:'OPPO Find X3 Pro','SM-F926B':'三星 Galaxy Z Fold3'};
    let connected = [], rentals = [], owners = {}, editingId = null, refreshing = false, refreshQueued = false;
    const displayName = (device) => device.label || names[device.model] || device.model || device.serial;
    const randomCode = () => { const bytes=crypto.getRandomValues(new Uint8Array(8)); return String.fromCharCode(97+bytes[0]%26,97+bytes[1]%26)+[...bytes.slice(2)].map((byte)=>String(byte%10)).join(''); };
    const expiryText = (rental) => rental.expiresAt ? new Date(rental.expiresAt).toLocaleString('zh-CN',{hour12:false}) : '永久有效';
    const loginText = (rental) => rental.lastLogin ? `最近登录：${new Date(rental.lastLogin).toLocaleString('zh-CN',{hour12:false})}` : '从未登录';
    const toast = (message, error = false) => { const el=$('#toast'); el.textContent=message; el.className=`toast${error?' error':''}`; el.style.display='block'; clearTimeout(el.timer); el.timer=setTimeout(()=>el.style.display='none',2600); };
    async function api(url, options) { const response=await fetch(url,{cache:'no-store',...options}); const data=await response.json().catch(()=>({})); if(!response.ok) throw Error(data.error || `HTTP ${response.status}`); return data; }
    function allDevices() {
        const map = new Map(connected.map((device) => [device.serial, device]));
        rentals.flatMap((rental) => rental.devices).forEach((serial) => { if (!map.has(serial)) map.set(serial, {serial, model:serial, offline:true}); });
        return [...map.values()];
    }
    function renderPicks(selected = []) {
        const devices = allDevices();
        $('#device-picks').innerHTML = devices.length ? devices.map((device) => {
            const owner = owners[device.serial];
            const occupied = owner && owner !== editingId;
            const ownerName = rentals.find((rental) => rental.id === owner)?.label;
            return `<label class="device-pick"><input type="checkbox" value="${esc(device.serial)}" ${selected.includes(device.serial)?'checked':''}><span><b>${esc(displayName(device))}</b><br><small>${esc(device.serial)}${occupied?` · 当前分配给 ${esc(ownerName)}`:''}</small></span><i class="${device.offline?'offline':'online'}"></i></label>`;
        }).join('') : '<div class="empty">当前没有连接的手机</div>';
    }
    function renderRentals() {
        $('#online-count').textContent = connected.length;
        $('#rental-count').textContent = rentals.length;
        $('#assigned-count').textContent = Object.keys(owners).length;
        const devices = allDevices();
        $('#rental-table').innerHTML = rentals.length ? '<div class="row head"><span>租用用户</span><span>设备快捷管理</span><span>租用期限</span><span>操作</span></div>' + rentals.map((rental) => {
            const assigned = rental.devices.map((serial) => {
                const device=devices.find((item)=>item.serial===serial) || {serial,model:serial,offline:true};
                return `<span class="device-chip"><span title="${esc(serial)}">${esc(displayName(device))}${device.offline?'（离线）':''}</span><button type="button" data-remove-device="${esc(serial)}" title="移除设备">×</button></span>`;
            }).join('') || '<span class="device-empty">未分配设备</span>';
            const available=devices.filter((device)=>!owners[device.serial]);
            const options=available.map((device)=>`<option value="${esc(device.serial)}">${esc(displayName(device))}</option>`).join('');
            const state=rental.expired?'已到期':rental.disabled?'已停用':'租用中';
            return `<div class="row ${rental.disabled?'disabled':''} ${rental.expired?'expired':''}" data-id="${rental.id}"><span class="user-cell"><b>${esc(rental.label)}</b><span class="code">${esc(rental.code)}</span><small>${esc(loginText(rental))}</small></span><span class="device-manager"><span class="device-chips">${assigned}</span><span class="quick-assign"><select data-add-select ${available.length?'':'disabled'}>${options || '<option>暂无可增加设备</option>'}</select><button class="primary" type="button" data-add-device ${available.length?'':'disabled'}>增加设备</button></span></span><span class="expiry">${esc(expiryText(rental))}<small>${state}</small></span><span class="actions"><button class="secondary" data-copy>复制租用信息</button><button class="secondary" data-qr>二维码</button><button class="secondary" data-edit>${rental.expired?'续租':'编辑'}</button><button class="${rental.disabled?'primary':'danger'}" data-toggle ${rental.expired?'disabled':''}>${rental.expired?'已到期':rental.disabled?'启用':'停用'}</button><button class="danger" data-delete>删除</button></span></div>`;
        }).join('') : '<div class="empty">还没有租用识别码</div>';
        document.querySelectorAll('[data-id]').forEach((row) => {
            const rental = rentals.find((item) => item.id === Number(row.dataset.id));
            row.querySelectorAll('[data-remove-device]').forEach((button) => button.onclick = () => patch(rental.id, {devices:rental.devices.filter((serial)=>serial!==button.dataset.removeDevice)}, '已移除设备'));
            row.querySelector('[data-add-device]').onclick = () => { const serial=row.querySelector('[data-add-select]').value; if(serial) void patch(rental.id,{devices:[...rental.devices,serial]},'已增加设备'); };
            row.querySelector('[data-copy]').onclick = () => copyInfo(rental);
            row.querySelector('[data-qr]').onclick = () => showQr(rental);
            row.querySelector('[data-edit]').onclick = () => edit(rental);
            row.querySelector('[data-toggle]').onclick = () => patch(rental.id, {disabled:!rental.disabled}, rental.disabled?'已启用':'已停用');
            row.querySelector('[data-delete]').onclick = () => remove(rental);
        });
    }
    async function refresh() {
        if (refreshing) { refreshQueued = true; return; }
        refreshing = true;
        const selected=[...document.querySelectorAll('#device-picks input:checked')].map((input)=>input.value);
        try {
            const me = await api('/api/auth/me');
            if (me.user?.role !== 'admin') { location.href='/'; return; }
            const [deviceData, rentalData] = await Promise.all([api('/api/devices/connected'), api('/api/rentals')]);
            connected = deviceData; rentals = rentalData.rentals; owners = rentalData.assignmentOwners;
            renderRentals();
            renderPicks(selected);
        } catch (error) { toast(error.message, true); }
        finally {
            refreshing = false;
            if (refreshQueued) { refreshQueued = false; void refresh(); }
        }
    }
    function setCodeRules(strict=true) { const input=$('#rental-code'); input.minLength=strict?8:6; input.maxLength=strict?8:64; input.pattern=strict?'[a-z]{2}[0-9]{6}':'[A-Za-z0-9_-]{6,64}'; }
    function resetForm() { editingId=null; $('#rental-form').reset(); setCodeRules(); $('#rental-code').value=randomCode(); $('#rental-duration').querySelector('[value="keep"]').hidden=true; $('#rental-duration').value='168'; $('#form-title').textContent='新建租用识别码'; $('#cancel-edit').hidden=true; renderPicks(); }
    function edit(rental) { editingId=rental.id; $('#rental-label').value=rental.label; $('#rental-code').value=rental.code; setCodeRules(/^[a-z]{2}[0-9]{6}$/.test(rental.code)); const keep=$('#rental-duration').querySelector('[value="keep"]'); keep.hidden=false; $('#rental-duration').value=rental.expired?'168':'keep'; $('#form-title').textContent=rental.expired?'续租并修改分配':'编辑租用识别码'; $('#cancel-edit').hidden=false; renderPicks(rental.devices); $('#rental-label').focus(); }
    async function patch(id, body, success) { try { await api(`/api/rentals/${id}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); toast(success); await refresh(); } catch(error){ toast(error.message,true); } }
    function confirmDelete(rental) { const dialog=$('#delete-dialog'); $('#delete-message').textContent=`确定删除“${rental.label}”（${rental.code}）吗？`; dialog.returnValue=''; dialog.showModal(); return new Promise((resolve)=>dialog.addEventListener('close',()=>resolve(dialog.returnValue==='delete'),{once:true})); }
    async function remove(rental) { if(!(await confirmDelete(rental)))return; try{await api(`/api/rentals/${rental.id}`,{method:'DELETE'});toast('已删除');if(editingId===rental.id)resetForm();await refresh();}catch(error){toast(error.message,true);} }
    async function copyText(text) { try{await navigator.clipboard.writeText(text);}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove();} }
    async function copyInfo(rental) { const origin=['127.0.0.1','localhost'].includes(location.hostname)?'https://phone.anyuekf.cn':location.origin; const info=`云手机租用信息\n登录链接：${origin}/\n识别码：${rental.code}\n有效期：${expiryText(rental)}\n请打开链接后手动输入识别码。`; await copyText(info); toast('链接、识别码和有效期已复制'); }
    function showQr(rental) { $('#qr-image').src=`/api/rentals/${rental.id}/qr?t=${Date.now()}`; $('#qr-code').textContent=rental.code; $('#qr-dialog').showModal(); }
    $('#rental-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const code=$('#rental-code').value.trim(); const existing=editingId?rentals.find((item)=>item.id===editingId):null;
        const body={label:$('#rental-label').value.trim(),devices:[...document.querySelectorAll('#device-picks input:checked')].map((input)=>input.value)};
        if(!existing || code!==existing.code) body.code=code;
        const duration=$('#rental-duration').value; if(duration!=='keep') body.expiresAt=duration==='0'?null:Date.now()+Number(duration)*60*60*1000;
        try { await api(editingId?`/api/rentals/${editingId}`:'/api/rentals',{method:editingId?'PATCH':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); toast(editingId?'修改已生效':'识别码已创建'); resetForm(); await refresh(); } catch(error){toast(error.message,true);}
    });
    $('#generate').onclick = () => { setCodeRules(); $('#rental-code').value=randomCode(); };
    $('#cancel-edit').onclick = resetForm;
    $('#logout').onclick = async () => { await fetch('/api/auth/logout',{method:'POST'}); location.href='/'; };
    document.querySelectorAll('[data-panel]').forEach((button) => button.onclick = () => {
        document.querySelectorAll('[data-panel]').forEach((item)=>item.classList.toggle('active',item===button));
        const proxy=button.dataset.panel==='proxy'; $('#rentals-panel').style.display=proxy?'none':''; $('#proxy-panel').style.display=proxy?'block':'none'; document.querySelector('.shell').classList.toggle('proxy',proxy);
        if(proxy && !$('#proxy-frame').src) $('#proxy-frame').src='http://127.0.0.1:8099/';
    });
    const events=new EventSource('/api/events');
    events.addEventListener('update',()=>refresh());
    $('#rental-code').value=randomCode(); refresh();
})();
</script>
</body>
</html>
