<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机远程控制</title>
    <link rel="icon" type="image/svg+xml" href="login-assets/tianxi-mark.svg"><link rel="icon" type="image/png" href="login-assets/favicon.png">
    <link rel="stylesheet" href="tianxi.css?v=20261112c">
    <link rel="stylesheet" href="phones.css?v=20261113p">
</head>
<body class="tx-scroll">
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-icon" src="login-assets/tianxi-mark.svg" alt="" width="32" height="32">
                <div class="sidebar-label"><strong>手机控制台</strong><small id="device-count">0 台设备</small></div>
                <button id="collapse" class="icon-button" type="button" title="收起侧栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            </div>
            <section class="controls" aria-label="批量操作">
                <button id="reconnect-all" type="button" title="全部重连"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg><b class="sidebar-label">全部重连</b></button>
                <button id="expand-first" type="button" title="首台放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg><b class="sidebar-label">首台放大</b></button>
                <button id="refresh-page" type="button" title="刷新页面" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/><path d="M3 21v-5h5"/></svg><b class="sidebar-label">刷新页面</b></button>
                <button id="install-app" type="button" title="打开软件库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><b class="sidebar-label">软件库</b></button>
                <button id="sync-toggle" type="button" title="同步操作" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg><b class="sidebar-label">同步关闭</b></button>
                <button id="screen-off-all" type="button" title="全部熄屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><b class="sidebar-label">全部熄屏</b></button>
                <button id="screen-on-all" type="button" title="全部亮屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><b class="sidebar-label">全部亮屏</b></button>
                <button id="close-all" type="button" title="关闭全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg><b class="sidebar-label">关闭全部</b></button>
            </section>
            <input id="app-package" type="file" accept=".apk,application/vnd.android.package-archive" hidden>
            <section class="settings sidebar-label" aria-label="画面设置">
                <div class="setting-row"><span class="tx-eyebrow">窗口大小</span><output id="size-value" hidden>400</output></div>
                <div class="size-switch" role="group" aria-label="窗口大小"><button type="button" data-size="300">小</button><button type="button" data-size="400" class="active" aria-pressed="true">中</button><button type="button" data-size="520">大</button></div>
                <input id="tile-size" type="hidden" value="400">
                <label for="quality" class="tx-eyebrow">画质</label>
                <select id="quality" data-tx-select><option value="auto" selected>自动（按窗口清晰度）</option><option value="1080">极速 480p</option><option value="1600">流畅 720p</option><option value="2400">清晰 1080p</option></select>
                <label for="fps" class="tx-eyebrow">帧率</label>
                <select id="fps" data-tx-select><option value="1">省流 1 FPS</option><option value="15">操作 15 FPS</option><option value="30" selected>流畅 30 FPS</option></select>
            </section>
            <nav class="device-nav sidebar-label tx-scroll" aria-label="设备"><h2 class="tx-eyebrow">我的设备</h2></nav>
            <a class="admin sidebar-label" href="admin.html?v=20261112a" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg><span>管理员设置</span></a>
        </aside>
        <main class="workspace">
            <header class="topbar">
                <div class="topbar-title"><strong>设备窗口</strong><span>点小窗全屏操作 · Esc 返回九宫格</span></div>
                <div class="stream-switch" role="group" aria-label="远控画面模式">
                    <button id="stream-video" type="button">流畅视频</button>
                    <button id="stream-snapshot" type="button">抽帧远控</button>
                </div>
                <button id="tile-all" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>自动平铺</button><select id="mobile-device-picker" data-tx-select data-tx-class="mobile-picker" aria-label="切换设备"></select>
            </header>
            <section id="phone-grid" class="phone-grid" aria-label="手机控制窗口"></section>
        </main>
    </div>
    <div id="viewer-backdrop" aria-hidden="true"></div>
    <dialog id="app-library" class="app-library" aria-labelledby="app-library-title">
        <header>
            <div><span class="tx-eyebrow">APK LIBRARY</span><strong id="app-library-title">软件库</strong><small>安装到 <b id="app-library-target">当前云机</b></small></div>
            <button id="app-library-close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </header>
        <div id="app-library-list" class="app-library-list tx-scroll"><p>正在读取软件列表…</p></div>
        <footer><button id="app-local-install" class="tx-btn tx-btn-secondary" type="button">选择本地 APK 安装</button></footer>
    </dialog>
    <script src="tianxi.js?v=20261112a"></script>
    <script src="browserMicPolicy.js?v=20261112a"></script>
    <script src="phoneAudio.js?v=20261113a"></script>
    <script src="phones.js?v=20261113s"></script>
</body>
</html>
