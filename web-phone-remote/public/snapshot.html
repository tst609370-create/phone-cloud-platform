<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>抽帧远控</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
        body { display: flex; }
        .device-view { width: 100%; height: 100%; display: flex; justify-content: center; }
        .video { display: grid; min-width: 0; min-height: 0; place-items: center; }
        .video-layer, .touch-layer { grid-area: 1 / 1; max-width: 100vw; max-height: 100vh; }
        .touch-layer { touch-action: none; user-select: none; -webkit-user-select: none; }
        #decoder { display: none; }
        #status { position: fixed; top: 8px; left: 8px; z-index: 5; padding: 4px 8px; border-radius: 5px; color: #ddd; background: rgba(0,0,0,.55); font: 12px monospace; pointer-events: none; }
        #status.hidden, .control-buttons-list { display: none; }
    </style>
</head>
<body data-embed-entry>
    <div id="status">正在获取清晰画面…</div>
    <main class="device-view">
        <div class="video">
            <canvas id="screen" class="video-layer"></canvas>
            <canvas id="touch" class="touch-layer"></canvas>
            <img id="decoder" alt="">
        </div>
        <div class="control-buttons-list" aria-hidden="true">
            <button title="返回"></button><button title="主页"></button><button title="多任务"></button><button title="截图"></button>
        </div>
    </main>
    <script src="snapshot.js?v=20260823d"></script>
</body>
</html>
